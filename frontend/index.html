<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Backend</h1>
    <button onclick="getData()">Click</button>
    <button onclick="postData()">Clcik for Post</button>
    <p id="result"></p>

    <script>
        async function getData() {
            const response = await fetch("http://localhost:3000/")
            const data = await response.text()

            document.getElementById("result").innerText = data;
        }

        async function postData() {
            const response = await fetch("http://localhost:3000/test",{ //ดึงข้อมูลจาก localhost
                method:"POST", //ประเภท POST
                headers:{"Content-Type":"application/json"}, //ส่งข้อความเป็น JSON
                body:JSON.stringify({ //json แปลงข้อความเป็น string
                    name:"New",
                    message:"Correct Answer"
                })
            })
            const data = await response.text() //data เก็บข้อความจาก response
            document.getElementById("result").innerText = JSON.stringify(data) //ให้ id result นำข้อมูลจาก data ที่แปลงเป็น string มาแสดง
        }

    </script>
</body>
</html>
